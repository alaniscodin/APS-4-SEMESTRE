# Configuracao do coletor meteorologico.
#
# Este arquivo e lido de duas formas, nesta ordem:
#  1. um coletor.properties na pasta onde o programa for executado (tem prioridade);
#  2. este, embutido no proprio programa.
#
# Assim da para mudar o comportamento sem recompilar: basta deixar uma copia
# editada deste arquivo ao lado do programa.

# Intervalo entre coletas, em segundos. O enunciado pede 10 para teste.
coletor.intervalo.segundos=10

# Fonte dos dados: API (Open-Meteo, dados reais) ou SIMULADOR (cenarios fixos).
coletor.fonte=API

# Usado so quando a fonte e SIMULADOR.
# Vazio = percorre todos os cenarios, um por coleta.
# Ou escolha um: CHUVA_FORTE, CALOR_SECO, VENTANIA, GEADA, TEMPO_BOM
coletor.simulador.cenario=

# Estacao: Sorocaba/SP
coletor.latitude=-23.50
coletor.longitude=-47.46
